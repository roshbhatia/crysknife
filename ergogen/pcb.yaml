pcbs:
  crysknife_left:
    template: kicad8
    outlines:
      board:
        outline: left__pcb_outline
    footprints:
      switches:
        what: ceoloide/switch_mx
        where: [[key, "meta.mirrored ~ false"]]
        params:
          side: B
          reversible: false
          hotswap: true
          solder: false
          from: "{{column_net}}"
          to: "{{colrow}}_SW"
      diodes:
        what: ceoloide/diode_tht_sod123
        where: [[key, "meta.mirrored ~ false"]]
        params:
          side: B
          reversible: false
          include_tht: false
          from: "{{colrow}}_SW"
          to: "{{row_net}}"
        adjust:
          resist: true
          shift: [horizontal_diode_shift, vertical_diode_shift]
          rotate: 90
      mount_outer_top:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_outer_home
        params:
          hole_size: 2.2
          hole_drill: 2.2
        adjust:
          shift: [0.5 ks, 0.5 kp]
      mount_outer_bottom:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_outer_bottom
        params:
          hole_size: 2.2
          hole_drill: 2.2
        adjust:
          shift: [0.5 ks, 0.5 kp]
      mount_inner_top:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_index_home
        params:
          hole_size: 2.2
          hole_drill: 2.2
        adjust:
          shift: [0.5 ks, 9]
      mount_inner_bottom:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_index_bottom
        params:
          hole_size: 2.2
          hole_drill: 2.2
        adjust:
          shift: [0.5 ks, -11]
      controller:
        what: crysknife/nice_nano_socketed
        where:
          ref: matrix_inner_top
        params:
          side: F
          reversible: false
          include_extra_pins: false
          include_traces: false
          show_instructions: false
          show_via_labels: false
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P5: R0
          P6: R1
          P7: R2
          P8: R3
          P2_label: D2
          P3_label: D3
          P4_label: D4
        adjust:
          shift: [19.704, "0.375 kp - 18.37"]
      power:
        what: ceoloide/power_switch_smd_side
        where:
          ref: matrix_inner_top
        params:
          side: F
          reversible: false
          from: BAT_P
          to: RAW
        adjust:
          shift: ["1.5 ks - 0.75", "0.375 kp - 46.50"]
      reset:
        what: ceoloide/reset_switch_smd_side
        where:
          ref: matrix_inner_top
        params:
          side: F
          reversible: false
          include_bosses: true
          from: GND
          to: RST
        adjust:
          shift: [19.704, "0.24 kp - 0.1"]
      battery:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: matrix_inner_top
        params:
          side: B
          reversible: false
          BAT_P: BAT_P
          BAT_N: GND
        adjust:
          shift: ["0.5 ks + 7.25", "0.375 kp - 45.25"]
          rotate: 90
  crysknife_right:
    $extends: pcbs.crysknife_left
    outlines.board.outline: right__pcb_outline
    footprints:
      mount_outer_top.asym: clone
      mount_outer_bottom.asym: clone
      mount_inner_top.asym: clone
      mount_inner_bottom.asym: clone
      switches.asym: clone
      diodes.asym: clone
      controller:
        asym: clone
      power:
        asym: clone
        adjust.rotate: 180
      reset.asym: clone
      battery:
        asym: clone
        adjust.rotate: -90

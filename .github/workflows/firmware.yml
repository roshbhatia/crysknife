name: Firmware

on:
  push:
    paths:
      - firmware/**
      - scripts/build_firmware.py
      - .github/workflows/firmware.yml
      - tools.lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    strategy:
      fail-fast: false
      matrix:
        shield: [crysknife_left, crysknife_right, settings_reset]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and record resolved dependencies
        run: python3 scripts/build_firmware.py '${{ matrix.shield }}'
      - name: Upload firmware and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.shield }}
          path: build/firmware/artifacts/${{ matrix.shield }}
          include-hidden-files: true
          if-no-files-found: error

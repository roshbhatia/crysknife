name: PCB draft checks

on:
  push:
    paths:
      - ergogen/**
      - assets/**
      - scripts/**
      - tscircuit/**
      - flake.*
      - case/**
      - manufacturing/parts.json
      - manufacturing/battery.json
      - manufacturing/header-fit.json
      - package*.json
      - .github/workflows/pcb.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - run: nix develop . --command npm ci
      - run: nix develop . --command npm run pcb
      - run: nix develop . --command python3 scripts/add_artwork.py
      - run: nix develop . --command npm ci --prefix tscircuit
      - run: nix develop . --command python3 scripts/build_tscircuit.py
      - run: nix develop . --command python3 scripts/check_electrical.py
      - run: nix develop . --command python3 scripts/generate_schematic.py
      - run: nix develop . --command python3 scripts/generate_assembly.py
      - run: nix develop . --command python3 scripts/check_assembly_guards.py
      - run: nix develop . --command python3 scripts/generate_case.py
      - run: nix develop . --command python3 scripts/check_case_models.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pcb-drafts
          path: |
            build/pcb
            build/tscircuit
            build/schematic
            build/case
            build/manufacturing
  check:
    needs: generate
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad@sha256:e36e29b5f4a638a1a7238eba3d2fcbc8e061ffed1e99a8f39cb722706c94a58e
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: pcb-drafts
          path: build
      - run: kicad-cli sch erc --format json --output build/schematic/left-erc.json build/schematic/fridakeys_left.kicad_sch
      - run: kicad-cli sch erc --format json --output build/schematic/right-erc.json build/schematic/fridakeys_right.kicad_sch
      - run: kicad-cli sch export netlist --format kicadxml --output build/schematic/left.net build/schematic/fridakeys_left.kicad_sch
      - run: kicad-cli sch export netlist --format kicadxml --output build/schematic/right.net build/schematic/fridakeys_right.kicad_sch
      - run: python3 scripts/check_schematic.py
      - run: kicad-cli sch export pdf --output build/schematic/left.pdf build/schematic/fridakeys_left.kicad_sch
      - run: kicad-cli sch export pdf --output build/schematic/right.pdf build/schematic/fridakeys_right.kicad_sch
      - run: python3 scripts/check_placement.py
      - run: python3 scripts/check_tscircuit_source.py
      - run: python3 scripts/merge_tscircuit_routes.py
      - run: python3 scripts/fill_ground.py
      - run: kicad-cli pcb drc --format json --output build/pcb/left-drc.json build/pcb/fridakeeb_left.kicad_pcb
      - run: kicad-cli pcb drc --format json --output build/pcb/right-drc.json build/pcb/fridakeeb_right.kicad_pcb
      - run: python3 scripts/check_drc_draft.py
      - run: kicad-cli pcb drc --format json --output build/pcb/left-routed-drc.json build/pcb/fridakeeb_left_routed.kicad_pcb
      - run: kicad-cli pcb drc --format json --output build/pcb/right-routed-drc.json build/pcb/fridakeeb_right_routed.kicad_pcb
      - run: python3 scripts/check_drc_draft.py --routed
      - run: mkdir -p build/manufacturing/quote-only/gerbers/left build/manufacturing/quote-only/gerbers/right
      - run: kicad-cli pcb export gerbers --layers F.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts --output build/manufacturing/quote-only/gerbers/left/ build/pcb/fridakeeb_left_routed.kicad_pcb
      - run: kicad-cli pcb export gerbers --layers F.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts --output build/manufacturing/quote-only/gerbers/right/ build/pcb/fridakeeb_right_routed.kicad_pcb
      - run: kicad-cli pcb export drill --output build/manufacturing/quote-only/gerbers/left/ build/pcb/fridakeeb_left_routed.kicad_pcb
      - run: kicad-cli pcb export drill --output build/manufacturing/quote-only/gerbers/right/ build/pcb/fridakeeb_right_routed.kicad_pcb
      - run: kicad-cli pcb export svg --mode-single --black-and-white --fit-page-to-board --exclude-drawing-sheet --layers F.SilkS,Edge.Cuts --output build/pcb/left-silkscreen.svg build/pcb/fridakeeb_left_routed.kicad_pcb
      - run: kicad-cli pcb export svg --mode-single --black-and-white --fit-page-to-board --exclude-drawing-sheet --layers F.SilkS,Edge.Cuts --output build/pcb/right-silkscreen.svg build/pcb/fridakeeb_right_routed.kicad_pcb
      - run: kicad-cli pcb export svg --mode-single --black-and-white --fit-page-to-board --exclude-drawing-sheet --layers B.SilkS,Edge.Cuts --output build/pcb/left-bottom-silkscreen.svg build/pcb/fridakeeb_left_routed.kicad_pcb
      - run: kicad-cli pcb export svg --mode-single --black-and-white --fit-page-to-board --exclude-drawing-sheet --layers B.SilkS,Edge.Cuts --output build/pcb/right-bottom-silkscreen.svg build/pcb/fridakeeb_right_routed.kicad_pcb
      - run: python3 scripts/save_outputs.py --evidence-dir build --revision "$GITHUB_SHA" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pcb-check-evidence
          path: |
            build/pcb
            build/tscircuit
            build/schematic
            build/manufacturing
            build/case
            out
            manufacturing/jlcpcb
            manufacturing/sendcutsend
